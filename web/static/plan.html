<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan today</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fff);
    --fg: var(--tg-theme-text-color, #000);
    --hint: var(--tg-theme-hint-color, #708499);
    --card: var(--tg-theme-secondary-bg-color, #f1f1f1);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-fg: var(--tg-theme-button-text-color, #fff);
    --line: color-mix(in srgb, var(--hint) 25%, transparent);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0 0 88px;
    background: var(--bg); color: var(--fg);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header { padding: 14px 16px 8px; }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .sub { color: var(--hint); font-size: 13px; }

  .capacity {
    display: flex; align-items: center; gap: 10px;
    margin: 12px 16px; padding: 12px 14px;
    background: var(--card); border-radius: 12px;
  }
  .capacity label { flex: 1; font-size: 14px; }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper button {
    width: 34px; height: 34px; border: 0; border-radius: 9px;
    background: var(--bg); color: var(--fg);
    font-size: 19px; line-height: 1; cursor: pointer;
  }
  .stepper button:active { opacity: .55; }
  .stepper .val { min-width: 62px; text-align: center; font-variant-numeric: tabular-nums; }

  ul { list-style: none; margin: 0; padding: 0 16px; }
  li {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 0; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  li:last-child { border-bottom: 0; }
  .tick {
    flex: 0 0 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--hint); display: grid; place-items: center;
    color: var(--accent-fg); font-size: 13px;
  }
  li.on .tick { background: var(--accent); border-color: var(--accent); }
  li.on .tick::after { content: "✓"; }
  .who { flex: 1; min-width: 0; }
  .nm { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { color: var(--hint); font-size: 12px; }

  .row { padding: 13px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .rowtop {
    display: flex; align-items: center; gap: 8px; margin-bottom: 9px;
  }
  .row .nm { flex: 1; min-width: 0; font-weight: 500; }
  /* The block's place in the day, previewed live. Same rules the bot
     will apply on submit: back to back from now, lunch jumped. */
  .bubble {
    flex: 0 0 auto; padding: 4px 9px; border-radius: 999px;
    background: var(--card); color: var(--fg);
    font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .bubble.lunch { color: var(--accent); }
  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .order { display: flex; gap: 4px; }
  .order button {
    width: 34px; height: 34px; border: 0; border-radius: 9px;
    background: var(--card); color: var(--fg); font-size: 14px; cursor: pointer;
  }
  .order button:disabled { opacity: .3; }
  .order button:active:not(:disabled) { opacity: .55; }
  select {
    flex: 1; min-width: 0; padding: 9px 10px; font-size: 14px;
    color: var(--fg); background: var(--card);
    border: 1px solid var(--line); border-radius: 9px;
  }
  .total {
    margin: 14px 16px; padding: 11px 14px; border-radius: 11px;
    background: var(--card); font-size: 14px;
  }
  .total.over { color: #d1453b; }
  .empty, .error { margin: 40px 16px; text-align: center; color: var(--hint); }
  .error { color: #d1453b; }
  .hidden { display: none; }
</style>
</head>
<body>

<div id="loading" class="empty">Loading projects…</div>
<div id="error" class="error hidden"></div>

<!-- Step 1: pick projects -->
<section id="step1" class="hidden">
  <header>
    <h1>What are you working on today?</h1>
    <div class="sub" id="count">Nothing selected</div>
  </header>
  <div class="capacity">
    <label for="cap">Hours available today</label>
    <div class="stepper">
      <button type="button" id="capDown" aria-label="Less">−</button>
      <span class="val" id="cap">3 h</span>
      <button type="button" id="capUp" aria-label="More">+</button>
    </div>
  </div>
  <ul id="list"></ul>
</section>

<!-- Step 2: type + duration for the chosen few -->
<section id="step2" class="hidden">
  <header>
    <h1>How long on each?</h1>
    <div class="sub" id="step2sub">Blocks run back to back from now,
      skipping 13:00–14:00. Use ▲▼ to change the running order.</div>
  </header>
  <div id="rows" style="padding: 0 16px;"></div>
  <div class="total" id="total"></div>
</section>

<script>
(function () {
  "use strict";

  // Defined FIRST, and as function declarations (fully hoisted with
  // their implementation) rather than var-assigned expressions: both
  // early-exit checks below call show() before this point in the file,
  // and a var would still be undefined then, throwing and silently
  // killing the whole script before fetch() ever runs — exactly what
  // happened live 2026-08-25 (zero requests logged, stuck on the
  // static "Loading projects…" text forever, no visible error).
  function $(id) { return document.getElementById(id); }
  function show(id, msg) {
    var el = $(id);
    el.classList.remove("hidden");
    if (msg) el.textContent = msg;
  }
  function hide(id) { $(id).classList.add("hidden"); }

  // A thrown error anywhere below otherwise leaves the page frozen on
  // its static "Loading projects…" text with nothing logged anywhere —
  // the phone has no console to inspect. Put the message on screen.
  window.onerror = function (msg) {
    hide("loading");
    show("error", "Something broke in the page: " + msg);
  };

  function fail(msg) {
    // Always clear the loading state: leaving it up renders the error
    // UNDER a live-looking "Loading projects…" and reads as a hang.
    hide("loading");
    show("error", msg);
  }

  var tg = window.Telegram && window.Telegram.WebApp;
  if (!tg) { fail("Open this from Telegram."); return; }
  tg.ready(); tg.expand();

  // Telegram's WebApp script loads fine outside a real Telegram launch
  // (e.g. this URL opened directly in a browser) — it just carries no
  // initData. Catch that HERE, distinctly, rather than letting it fall
  // through to the server's generic 401 "unauthorized" (which looks
  // identical to a real signature failure and was undiagnosable from
  // the outside — discovered live, 2026-08-25).
  if (!tg.initData) {
    fail("Telegram didn't pass any launch data to this page, so the bot " +
         "can't tell who you are. Open it from the \"📋 Plan today\" button " +
         "in the chat with the bot — a plain link or a browser tab won't " +
         "work. (Telegram version " + (tg.version || "unknown") +
         ", platform " + (tg.platform || "unknown") + ".)");
    return;
  }

  var CFG = null;          // server config payload
  var picked = [];         // project ids, in the running order (step 2 reorders)
  var plan = {};           // id -> {type, minutes}
  var capacity = 3;
  var step = 1;
  var loadedAt = Date.now();   // paired with CFG.nowMinutes, see schedule()

  // ── load ───────────────────────────────────
  fetch("api/projects", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ initData: tg.initData })
  })
    .then(function (r) {
      return r.json().then(function (b) {
        if (!r.ok) throw new Error(b.error || "Could not load projects");
        return b;
      });
    })
    .then(function (data) {
      CFG = data;
      capacity = data.defaultCapacityHours;
      hide("loading");
      renderCapacity();
      renderList();
      show("step1");
      wireMainButton();
    })
    .catch(function (e) {
      hide("loading");
      show("error", e.message);
    });

  // ── step 1 ─────────────────────────────────
  function renderCapacity() { $("cap").textContent = trim(capacity) + " h"; }

  $("capUp").onclick = function () {
    capacity = Math.min(CFG.maxCapacityHours, capacity + 0.5);
    renderCapacity(); redistribute();
  };
  $("capDown").onclick = function () {
    capacity = Math.max(0.5, capacity - 0.5);
    renderCapacity(); redistribute();
  };

  function renderList() {
    var ul = $("list");
    ul.innerHTML = "";
    if (!CFG.projects.length) {
      show("error", "No projects are currently in Designing or Fabricating.");
      return;
    }
    CFG.projects.forEach(function (p) {
      var li = document.createElement("li");
      li.dataset.id = p.id;
      var bits = [p.status, p.process];
      if (p.hours) bits.push(p.hours + " h logged");
      li.innerHTML =
        '<span class="tick"></span>' +
        '<span class="who"><span class="nm"></span>' +
        '<span class="meta"></span></span>';
      li.querySelector(".nm").textContent = p.name;
      li.querySelector(".meta").textContent = bits.filter(Boolean).join(" · ");
      li.onclick = function () { toggle(p.id, li); };
      ul.appendChild(li);
    });
  }

  function toggle(id, li) {
    var at = picked.indexOf(id);
    if (at === -1) { picked.push(id); li.classList.add("on"); }
    else { picked.splice(at, 1); delete plan[id]; li.classList.remove("on"); }
    if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
    redistribute();
    $("count").textContent = picked.length
      ? picked.length + " selected"
      : "Nothing selected";
    syncMainButton();
  }

  // Split the declared hours evenly over what's picked, on the grid.
  // Only rewrites durations the designer hasn't touched yet.
  function redistribute() {
    if (!picked.length) return;
    var each = snap((capacity * 60) / picked.length);
    picked.forEach(function (id) {
      if (!plan[id]) plan[id] = { type: CFG.blockTypes[0], minutes: each, auto: true };
      else if (plan[id].auto) plan[id].minutes = each;
    });
    if (step === 2) renderRows();
  }

  function snap(mins) {
    var g = CFG.gridMinutes;
    return Math.max(CFG.minMinutes, Math.round(mins / g) * g);
  }

  // ── step 2 ─────────────────────────────────
  // The day, previewed. Mirrors core/planning.pack_blocks: blocks run
  // back to back from now (rounded up to the grid) and a block that
  // would start inside — or run into — the shared lunch hour starts
  // after it instead. Everything is minutes past SGT midnight, so the
  // phone's own clock and time zone never enter into it: the server
  // sent nowMinutes, and we only add the minutes elapsed since.
  function schedule() {
    var elapsed = Math.floor((Date.now() - loadedAt) / 60000);
    var cursor = ceilTo(CFG.nowMinutes + elapsed, CFG.gridMinutes);
    var lunchA = CFG.lunchStartMinutes, lunchB = CFG.lunchEndMinutes;

    return picked.map(function (id) {
      var mins = plan[id].minutes, jumped = false;
      if (cursor >= lunchA && cursor < lunchB) { cursor = lunchB; jumped = true; }
      var end = cursor + mins;
      if (cursor < lunchB && lunchA < end) {
        cursor = lunchB; end = cursor + mins; jumped = true;
      }
      var slot = { id: id, start: cursor, end: end, jumped: jumped };
      cursor = end;
      return slot;
    });
  }

  function renderRows() {
    var host = $("rows");
    host.innerHTML = "";
    picked.forEach(function (id, index) {
      var p = byId(id), entry = plan[id];
      var row = document.createElement("div");
      row.className = "row";
      row.innerHTML =
        '<div class="rowtop">' +
          '<span class="nm"></span>' +
          '<span class="bubble" data-for="' + id + '"></span>' +
        '</div>' +
        '<div class="controls">' +
          '<select></select>' +
          '<div class="stepper">' +
            '<button type="button" class="mn">−</button>' +
            '<span class="val"></span>' +
            '<button type="button" class="pl">+</button>' +
          '</div>' +
          '<div class="order">' +
            '<button type="button" class="up" aria-label="Earlier">▲</button>' +
            '<button type="button" class="dn" aria-label="Later">▼</button>' +
          '</div>' +
        '</div>';
      row.querySelector(".nm").textContent = p.name;

      var sel = row.querySelector("select");
      CFG.blockTypes.forEach(function (t) {
        var o = document.createElement("option");
        o.value = t; o.textContent = t;
        if (t === entry.type) o.selected = true;
        sel.appendChild(o);
      });
      sel.onchange = function () { entry.type = sel.value; };

      var val = row.querySelector(".val");
      val.textContent = fmt(entry.minutes);
      row.querySelector(".mn").onclick = function () {
        entry.minutes = Math.max(CFG.minMinutes, entry.minutes - CFG.gridMinutes);
        entry.auto = false; val.textContent = fmt(entry.minutes); renderTimes();
      };
      row.querySelector(".pl").onclick = function () {
        entry.minutes += CFG.gridMinutes;
        entry.auto = false; val.textContent = fmt(entry.minutes); renderTimes();
      };

      // Reorder, because the running order IS the order the bot lays
      // the day out in. Arrows rather than drag-and-drop: dragging
      // inside a Telegram webview fights the page's own scrolling.
      var up = row.querySelector(".up"), down = row.querySelector(".dn");
      up.disabled = index === 0;
      down.disabled = index === picked.length - 1;
      up.onclick = function () { move(index, -1); };
      down.onclick = function () { move(index, 1); };

      host.appendChild(row);
    });
    renderTimes();
  }

  function move(index, by) {
    var to = index + by;
    if (to < 0 || to >= picked.length) return;
    var moved = picked.splice(index, 1)[0];
    picked.splice(to, 0, moved);
    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
    renderRows();
  }

  // Times only — cheap enough to run on every tap and on a clock tick,
  // and it leaves the selects and steppers untouched.
  function renderTimes() {
    var slots = schedule();
    slots.forEach(function (slot) {
      var el = document.querySelector('.bubble[data-for="' + slot.id + '"]');
      if (!el) return;
      el.textContent = clock(slot.start) + "–" + clock(slot.end);
      el.classList.toggle("lunch", slot.jumped);
    });
    if (slots.length) {
      $("step2sub").textContent =
        "Runs " + clock(slots[0].start) + "–" + clock(slots[slots.length - 1].end)
        + ", skipping 13:00–14:00. Use ▲▼ to reorder.";
    }
    renderTotal();
  }

  function renderTotal() {
    var mins = picked.reduce(function (s, id) { return s + plan[id].minutes; }, 0);
    var el = $("total");
    el.textContent = fmt(mins) + " planned of " + trim(capacity) + " h available";
    el.classList.toggle("over", mins > capacity * 60);
  }

  // The preview is relative to *now*, so it goes stale on its own if
  // the designer sits on this screen. One tick a minute keeps it honest.
  setInterval(function () { if (step === 2) renderTimes(); }, 60000);

  // ── navigation ─────────────────────────────
  function wireMainButton() {
    tg.MainButton.onClick(function () {
      if (step === 1) {
        if (!picked.length) return;
        step = 2; hide("step1"); renderRows(); show("step2");
        tg.BackButton.show();
        syncMainButton();
      } else {
        submit();
      }
    });
    tg.BackButton.onClick(function () {
      step = 1; hide("step2"); show("step1");
      tg.BackButton.hide(); syncMainButton();
    });
    syncMainButton();
  }

  function syncMainButton() {
    if (step === 1) {
      tg.MainButton.setText(picked.length ? "Next — set durations" : "Pick projects");
      picked.length ? tg.MainButton.enable() : tg.MainButton.disable();
      tg.MainButton.show();
    } else {
      tg.MainButton.setText("Confirm plan");
      tg.MainButton.enable();
      tg.MainButton.show();
    }
  }

  function submit() {
    // NOT tg.sendData(): that only exists for reply-keyboard launches,
    // which carry no initData and so could never have loaded this page.
    // Post to our own API instead, authenticated the same way the
    // project list was.
    tg.MainButton.showProgress();
    fetch("api/plan", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        initData: tg.initData,
        capacity_hours: capacity,
        blocks: picked.map(function (id) {
          return { project_id: id, block_type: plan[id].type,
                   minutes: plan[id].minutes };
        })
      })
    })
      .then(function (r) {
        return r.json().then(function (b) {
          if (!r.ok) throw new Error(b.error || "Could not save the plan");
          return b;
        });
      })
      .then(function () {
        tg.MainButton.hideProgress();
        // The bot DMs the full plan; closing lands the designer on it.
        tg.close();
      })
      .catch(function (e) {
        tg.MainButton.hideProgress();
        if (tg.showAlert) tg.showAlert(e.message);
        else fail(e.message);
      });
  }

  // ── helpers ────────────────────────────────
  function byId(id) {
    for (var i = 0; i < CFG.projects.length; i++) {
      if (CFG.projects[i].id === id) return CFG.projects[i];
    }
    return { name: "(unknown)" };
  }
  function trim(n) { return String(Math.round(n * 100) / 100); }
  function ceilTo(mins, step) { return Math.ceil(mins / step) * step; }
  function clock(mins) {
    var m = ((mins % 1440) + 1440) % 1440;   // a very long day still reads right
    return pad(Math.floor(m / 60)) + ":" + pad(m % 60);
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function fmt(mins) {
    var h = Math.floor(mins / 60), m = mins % 60;
    if (!h) return m + "m";
    return m ? h + "h " + m + "m" : h + "h";
  }
})();
</script>
</body>
</html>
